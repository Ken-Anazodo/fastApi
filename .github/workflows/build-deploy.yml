      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest #this specifies the operating system that the workflow will run on in the machine provided by github action(CI/CD tool). In this case, it's Ubuntu latest version.
    needs: [build] #we tell the workflow that deploy job needs to wait for the build job to complete before it runs. "needs" is used to define the list of jobs that needs to complete before deploy (job) runs.    

    steps:
    - name: deploy to server
      # uses: actions/checkout@v7
      run: echo "deploying some stuff to the server"

